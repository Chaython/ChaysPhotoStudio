# Temporary one-shot dependency-lock refresh for the PDF import PR.
# Delete this workflow after bun.lock is committed.
name: Refresh PDF import lockfile
on:
  push:
    branches:
      - feat/recover-audited-branch-gaps-20261014
    paths:
      - .github/workflows/pdf-import-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate Bun lockfile without executing installation scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --lockfile-only --ignore-scripts
      - name: Commit lockfile for frozen CI
        run: |
          if git diff --quiet -- bun.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build(pdf): refresh frozen Bun lockfile"
          git push origin "HEAD:feat/recover-audited-branch-gaps-20261014"
