name: One-shot PDF native Help regeneration
on:
  push:
    branches:
      - feat/pdf-native-text-vector-layers-20261014
    paths:
      - .github/workflows/pdf-native-help-sync.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate guide exactly from Help topics
        run: bun scripts/generate-help.ts
      - name: Commit the canonical generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/USER_GUIDE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: regenerate guide from current in-app Help topics"
          git push origin HEAD:feat/pdf-native-text-vector-layers-20261014
