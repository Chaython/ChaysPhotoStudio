# Chay's Photo Studio — pull-request verification and build smoke tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate app icons
        run: bun run icons

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

  build-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client and icons
        run: |
          bun run db:generate
          bun run icons

      - name: Build standalone web app
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Assemble Electron payload
        run: bun run app:prepare

      - name: Build browser extensions
        run: bun run ext:build

      - name: Verify expected build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f build/electron/app/server.js
          test -f build/extension/unpacked/manifest.json
          test -f build/extension/firefox/manifest.json
          test -f "build/extension/chays-photo-studio-extension-v$(node -p \"require('./package.json').version\").zip"
          test -f "build/extension/chays-photo-studio-extension-firefox-v$(node -p \"require('./package.json').version\").zip"
