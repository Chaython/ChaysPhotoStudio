# Chay's Photo Studio — CI: typecheck + lint on every push/PR
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (source of PrismaClient types)
        run: bun run db:generate

      - name: Generate app icons (files referenced by the app shell)
        run: node scripts/gen-icons.mjs

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
