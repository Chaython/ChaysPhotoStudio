# Chay's Photo Studio — pull-request verification and build smoke tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Generate app icons
        run: bun run icons

      - name: Validate distribution metadata
        run: bun run dist:validate

      - name: Validate Electron static JS/CSS packaging layouts
        run: node scripts/validate-electron-asset-layout.mjs

      - name: Parse lazy Electron GIMP host
        run: node --check electron/gimp-runtime.cjs

      - name: Validate GIMP compatibility analyzer
        run: bun run gimp:validate

      - name: Validate all editor tools
        run: bun run tools:validate

      - name: Validate web slices, hotspots and safe HTML image maps
        run: bun run web-assets:validate

      - name: Validate canvas Slice and Hotspot geometry
        run: bun scripts/validate-web-region-tools.ts

      - name: Validate multi-artboard geometry, grid coverage and crop bounds
        run: bun run artboards:validate

      - name: Validate Count Tool serialization and group limits
        run: bun scripts/validate-count-markers.ts

      - name: Validate local design templates and brand kits
        run: bun run design-library:validate

      - name: Validate CSV-driven design merge and source isolation
        run: bun run design-merge:validate

      - name: Validate document-linked brand styles
        run: bun run linked-styles:validate

      - name: Validate ruler calibration and persistent-tool overlays
        run: bun scripts/validate-measure.ts

      - name: Validate color sampler CSV and Info controls
        run: bun scripts/validate-sampler-report.ts

      - name: Validate editable canvas context menu
        run: bun scripts/validate-layer-context-menu.ts

      - name: Validate content-sized docks
        run: bun run dock-sizing:validate

      - name: Validate eight-way dock routing
        run: bun run dock-routing:validate

      - name: Validate camera, HDR, scientific and multi-page formats
        run: bun run formats:validate

      - name: Validate interactive video-frame picker and import routing
        run: bun run video-frame:validate

      - name: Validate PDF page selection, memory budgets and error handling
        run: bun run pdf:validate

      - name: Validate independent PSD/PSB binary fixtures
        run: bun run psd:real-validate

      - name: Validate retouch stroke safety
        run: bun run retouch-safety:validate

      - name: Validate Float32 HDR retouch precision
        run: bun scripts/validate-hdr-retouch.ts

      - name: Validate native Float16 tonal retouch precision
        run: bun scripts/validate-native-float16-tone.ts

      - name: Validate Float32 HDR Blur and Sharpen
        run: bun scripts/validate-hdr-detail-retouch.ts

      - name: Validate Float32 HDR Smudge
        run: bun scripts/validate-hdr-smudge.ts

      - name: Validate Puppet Warp geometry
        run: bun run warp:validate

      - name: Validate History pixel isolation
        run: bun run history:validate

      - name: Validate document-scoped preview cleanup
        run: bun run preview-lifecycle:validate

      - name: Validate asynchronous selection and locked Fill
        run: bun run selection-races:validate

      - name: Validate recovery autosave scheduling
        run: bun run autosave:validate

      - name: Validate worker error recovery
        run: bun run worker:validate

      - name: Validate worker timeout isolation
        run: bun run worker-timeout:validate

      - name: Validate HDR raster geometry
        run: bun run hdr:validate

      - name: Validate selection pixel lifting
        run: bun run selection-pixels:validate

      - name: Validate color-matched selection expansion
        run: bun run selection-color:validate

      - name: Validate stroke selection placement
        run: bun run selection-stroke:validate

      - name: Validate Offset filter precision and edge handling
        run: bun run offset:validate

      - name: Validate in-app Help and user guide
        run: bun run help:validate

      - name: Validate layer transparency selections
        run: bun run layer-alpha:validate

      - name: Validate Layer Matting no-ops and History
        run: bun run layer-matting:validate

      - name: Validate native float16 read and write safety
        run: bun run float16-safety:validate

      - name: Validate HDR layer masks
        run: bun run layer-mask:validate

      - name: Validate HDR layer compositing
        run: bun run hdr-composite:validate

      - name: Validate scene-linear HDR Fill
        run: bun run hdr-fill:validate

      - name: Validate Float32 object-layer extraction
        run: bun run hdr-object-layer:validate

      - name: Validate bounded Fill coverage
        run: bun run fill-coverage:validate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client and icons
        run: |
          bun run db:generate
          bun run icons

      - name: Build standalone web app
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Assemble Electron payload
        run: bun run app:prepare

      - name: Build browser extensions
        run: bun run ext:build

      - name: Build GitHub Pages static app
        run: node scripts/export-webapp.mjs pages

      - name: Validate embedded webview configuration
        run: |
          # ext:build already produced build/webapp-export above.
          node scripts/webview-config.mjs
          node -e "const c=require('./webview/src-tauri/tauri.conf.release.json'); if(c.build.frontendDist!=='../../build/webapp-export') process.exit(1)"
          node -e "const c=require('./webview/src-tauri/tauri.conf.json'); const w=c.app?.windows?.[0]; if(w?.dataDirectory!=='profile-v2-no-pwa') process.exit(1)"
          node -e "const s=require('fs').readFileSync('public/sw.js','utf8'); if(!s.includes(\"self.location.hostname === 'tauri.localhost'\") || !s.includes('self.registration.unregister()')) process.exit(1)"

      - name: Set up Python for browser end-to-end tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright automation
        run: |
          python -m pip install 'playwright==1.57.0'
          command -v google-chrome || command -v chromium

      - name: Test real Chromium editor interactions
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory build/webapp-export > /tmp/chays-e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          python scripts/test-chromium-editor.py

      - name: Upload Chromium E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-editor-e2e
          path: build/chromium-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify expected build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f build/electron/app/server.js
          test -d build/electron/app/.next/server
          test -d build/electron/app/.next/static
          test -f build/webapp-export/index.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('build/webapp-export/index.html','utf8'); if (!/(?:src|href)=[\"']\\/_next\\//.test(h) || /(?:src|href)=[\"']\\.\\/_next\\//.test(h)) process.exit(1)"
          test -f build/webapp-export-pages/index.html
          test -f build/webapp-export-pages/.nojekyll
          grep -q '/ChaysPhotoStudio/_next/' build/webapp-export-pages/index.html
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('./build/webapp-export-pages/manifest.webmanifest','utf8')); if(m.start_url!=='/ChaysPhotoStudio/' || m.scope!=='/ChaysPhotoStudio/' || !m.icons.every(i=>i.src.startsWith('/ChaysPhotoStudio/'))) process.exit(1)"
          test -f build/extension/unpacked/manifest.json
          test -f build/extension/firefox/manifest.json
          VERSION="$(node -p "require('./package.json').version")"
          test -f "build/extension/chays-photo-studio-extension-v${VERSION}.zip"
          test -f "build/extension/chays-photo-studio-extension-firefox-v${VERSION}.zip"
