# ============================================================
# Chay's Photo Studio — Release pipeline
# Triggers:
#   • every push to the default branch → full build of ALL bundles
#     + automatic continuous release (prerelease, tagged
#     v{version}-b{run number})
#   • git tag v*.*.* → stable release marked as Latest
#   • manual dispatch → same as a continuous build
#
# Products (every run):
#   • Web (self-hostable Next.js standalone bundle — the PWA)
#   • Optional GitHub Pages deployment of the static webapp
#     (enabled with the repository variable ENABLE_GITHUB_PAGES=true)
#   • Electron desktop packages (Windows NSIS + portable, macOS dmg
#     (Intel + Apple Silicon), Linux AppImage + deb) — fully offline
#   • System-webview shell (Tauri: deb/AppImage/dmg/nsis)
#     — embeds the static editor by default; optional remote URL mode
#   • Browser plugin (Chrome MV3 + Firefox variant) — the full
#     editor bundled inside, no server needed
#   • GitHub Release with all assets + SHA256SUMS.txt
#
# Repository variables (Settings → Secrets and variables → Actions
# → Variables) — all optional:
#   ENABLE_GITHUB_PAGES  set to true after enabling Pages with the
#                        "GitHub Actions" source in repository settings
#   WEBVIEW_APP_URL      optional deployed editor URL. If unset, the
#                        Tauri shell embeds the static editor and is offline.
# ============================================================
name: Release — Build & Distribute

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # Web bundle + shared icons (standalone server, self-hostable)
  # + static exports (GitHub Pages flavor, plugin flavor)
  # ---------------------------------------------------------
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (source of PrismaClient types)
        run: bun run db:generate

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Validate distribution metadata
        run: node scripts/validate-distribution.mjs

      - name: Build (Next.js standalone)
        run: bun run build

      - name: Bundle standalone server for self-hosting
        run: tar -czf web-standalone.tar.gz -C .next/standalone .

      - name: Build static webapp exports (Pages + plugin flavors)
        run: node scripts/export-webapp.mjs both

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-standalone
          path: web-standalone.tar.gz
          if-no-files-found: error

      - name: Upload static webapp (Pages flavor)
        uses: actions/upload-artifact@v7
        with:
          name: webapp-static-pages
          path: build/webapp-export-pages/
          if-no-files-found: error

      - name: Upload static webapp (plugin flavor)
        uses: actions/upload-artifact@v7
        with:
          name: webapp-static-plugin
          path: build/webapp-export/
          if-no-files-found: error

      - name: Upload icons (electron builder resources)
        uses: actions/upload-artifact@v7
        with:
          name: app-icons
          path: build/icons
          if-no-files-found: error

      - name: Upload icons (tauri)
        uses: actions/upload-artifact@v7
        with:
          name: tauri-icons
          path: webview/src-tauri/icons
          if-no-files-found: error

  # ---------------------------------------------------------
  # GitHub Pages — optional static deployment. GitHub does not allow every
  # GITHUB_TOKEN to create/enable a Pages site, so repository setup is a
  # deliberate one-time action instead of a permanently red CI job.
  # ---------------------------------------------------------
  pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-24.04
    needs: web
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download static webapp
        uses: actions/download-artifact@v8
        with:
          name: webapp-static-pages
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------
  # Electron desktop packages — one leg per OS (native modules
  # are platform-specific, so each OS runs its own full build)
  # ---------------------------------------------------------
  electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            builder-args: --linux --x64
          - name: windows-x64
            os: windows-latest
            builder-args: --win --x64
          - name: macos-x64
            os: macos-15-intel
            builder-args: --mac --x64
          - name: macos-arm64
            os: macos-latest
            builder-args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (source of PrismaClient types)
        run: bun run db:generate

      - name: Generate app icons
        run: node scripts/gen-icons.mjs

      - name: Build (Next.js standalone)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Assemble Electron app
        run: node scripts/prepare-electron-app.mjs

      - name: Package desktop builds (electron-builder)
        run: bunx electron-builder ${{ matrix.builder-args }} --config electron-builder.yml --publish never
        env:
          # unsigned CI builds — see DISTRIBUTION.md for local signing
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged Electron payload
        run: node scripts/verify-electron-package.mjs

      - name: Boot-smoke packaged Electron
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          APP_BIN="$(find build/electron/dist/linux-unpacked -maxdepth 1 -type f -perm -111 -size +20M -print -quit)"
          test -n "$APP_BIN"
          echo "Smoke testing: $APP_BIN"
          CHAYS_SMOKE_TEST=1 timeout 45s xvfb-run -a "$APP_BIN" --no-sandbox

      - name: Upload desktop builds
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.name }}
          path: |
            build/electron/dist/*.exe
            build/electron/dist/*.dmg
            build/electron/dist/*.AppImage
            build/electron/dist/*.deb
            build/electron/dist/latest*.yml
          if-no-files-found: error

  # ---------------------------------------------------------
  # System-webview shell (Tauri v2 — uses the OS webview and embeds
  # the static editor by default; optional remote thin-shell mode)
  # ---------------------------------------------------------
  webview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            arch: x64
            bundles: nsis
          - name: macos-x64
            os: macos-15-intel
            arch: x64
            bundles: dmg,app
          - name: macos-arm64
            os: macos-latest
            arch: arm64
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked JavaScript tooling
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile

      - name: Linux build dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: webview/src-tauri

      - name: Repair compatible Cargo lock resolution
        working-directory: webview/src-tauri
        run: cargo update -p toml_parser --precise "1.1.3+spec-1.1.0"

      - name: Restore icons
        uses: actions/download-artifact@v8
        with:
          name: tauri-icons
          path: webview/src-tauri/icons

      - name: Restore static webapp for embedded webview
        uses: actions/download-artifact@v8
        with:
          name: webapp-static-plugin
          path: build/webapp-export

      - name: Configure webview frontend
        run: node scripts/webview-config.mjs
        env:
          # Empty by default: ship the static editor inside the native bundle.
          # Set WEBVIEW_APP_URL in repository variables only for a thin remote shell.
          WEBVIEW_APP_URL: ${{ vars.WEBVIEW_APP_URL }}
          WEBVIEW_FRONTEND_DIST: ../../build/webapp-export

      - name: Build webview shell
        working-directory: webview/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          bunx @tauri-apps/cli build --config tauri.conf.release.json --bundles ${{ matrix.bundles }} 2>&1 | tee webview-build.log
        env:
          RUST_BACKTRACE: '1'

      # Surface the actual error in the job summary (visible without
      # downloading full logs) if the build fails.
      - name: Dump build output on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Webview build failure — last 120 lines"
            echo '```'
            tail -120 webview/src-tauri/webview-build.log || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find webview/src-tauri/target/release/bundle -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No .app bundle was produced" >&2
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH" .app)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "webview/src-tauri/target/release/bundle/${APP_NAME}-${{ matrix.arch }}.app.zip"

      - name: Upload webview bundles
        uses: actions/upload-artifact@v7
        with:
          name: webview-${{ matrix.name }}
          path: |
            webview/src-tauri/target/release/bundle/**/*.deb
            webview/src-tauri/target/release/bundle/**/*.AppImage
            webview/src-tauri/target/release/bundle/**/*.dmg
            webview/src-tauri/target/release/bundle/**/*.app.zip
            webview/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------
  # Browser plugin (Chrome MV3 + Firefox variant zips) — the full
  # editor webapp bundled inside; assembled from the static export
  # ---------------------------------------------------------
  extension:
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore icons
        uses: actions/download-artifact@v8
        with:
          name: app-icons
          path: build/icons

      - name: Restore static webapp (plugin flavor)
        uses: actions/download-artifact@v8
        with:
          name: webapp-static-plugin
          path: build/webapp-export

      - name: Build plugin zips
        run: node scripts/build-extension.mjs

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: build/extension
          if-no-files-found: error

  # ---------------------------------------------------------
  # GitHub Release — everything above + checksums (every run)
  # ---------------------------------------------------------
  release:
    needs: [web, electron, webview, extension]
    # NOTE: `pages` is intentionally not a dependency — a Pages hiccup
    # (e.g. org policy) must never block artifact publishing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compute release tag
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            echo "tag=v${VER}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build ${GITHUB_RUN_NUMBER} ($(echo "$GITHUB_SHA" | cut -c1-7))" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten into release folder
        run: |
          set -euo pipefail
          mkdir -p release
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            dest="release/$name"
            if [[ -e "$dest" ]]; then
              if cmp -s "$file" "$dest"; then
                echo "Skipping duplicate identical asset: $name"
                continue
              fi
              echo "Release asset filename collision: $name" >&2
              echo "  existing: $dest" >&2
              echo "  incoming: $file" >&2
              exit 1
            fi
            cp "$file" "$dest"
          done < <(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.zip' -o -name '*.tar.gz' \) -print0)
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate checksums
        run: |
          cd release
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          draft: false
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          make_latest: ${{ steps.rel.outputs.pre == 'false' }}
          generate_release_notes: true
          files: |
            release/*
          body: |
            **Chay's Photo Studio** — distribution build

            | Channel | Assets |
            |---|---|
            | 🌐 Web app | `web-standalone.tar.gz` for self-hosting; optional GitHub Pages when `ENABLE_GITHUB_PAGES=true` |
            | 🖥️ Electron desktop (fully offline) | `ChaysPhotoStudio-Setup-*.exe` installer + `ChaysPhotoStudio-Portable-*-x64.exe` no-install build (Windows) · `ChaysPhotoStudio-*-x64.dmg` / `ChaysPhotoStudio-*-arm64.dmg` (macOS) · `*.AppImage` / `*.deb` (Linux) |
            | 🪶 Webview shell (native system webview) | `chays-photo-studio-webview_*` bundles — static editor embedded by default |
            | 🧩 Browser plugin (self-contained — the whole editor bundled inside, works offline) | `chays-photo-studio-extension-*.zip` (Chrome) · `chays-photo-studio-extension-firefox-*.zip` |
            | 🏠 Self-hosting / PWA server | `web-standalone.tar.gz` (Node ≥ 20, `node server.js` — installable as an app from the browser) |

            Continuous builds are published on every push to the default branch;
            stable `v*.*.*` tags are marked as the latest release. See `DISTRIBUTION.md`
            in the repository for install instructions, repository variables
            (`ENABLE_GITHUB_PAGES`, optional `WEBVIEW_APP_URL`), and signing notes.

