name: Refresh format-codec lockfile
on:
  push:
    branches: [format-audit-sgi-sunras-raw-clarity]
    paths: [package.json]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: format-audit-sgi-sunras-raw-clarity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve and lock optional image codecs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --no-frozen-lockfile --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock optional image codecs"
            git push origin HEAD:format-audit-sgi-sunras-raw-clarity
          fi
