name: WebView Runtime Diagnostic

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  linux-webview-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: bun install --frozen-lockfile

      - name: Install WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Generate prerequisites
        run: |
          bun run db:generate
          bun run icons

      - name: Repair compatible Cargo lock resolution
        working-directory: webview/src-tauri
        run: cargo update -p toml_parser --precise "1.1.3+spec-1.1.0"

      - name: Build embedded static app
        run: node scripts/export-webapp.mjs plugin

      - name: Configure WebView
        run: node scripts/webview-config.mjs
        env:
          WEBVIEW_APP_URL:
          WEBVIEW_FRONTEND_DIST: ../../build/webapp-export

      - name: Build diagnostic AppImage
        working-directory: webview/src-tauri
        run: bunx @tauri-apps/cli build --config tauri.conf.release.json --bundles appimage
        env:
          RUST_BACKTRACE: '1'

      - name: Upload diagnostic AppImage
        uses: actions/upload-artifact@v7
        with:
          name: webview-runtime-diagnostic-linux
          path: webview/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
