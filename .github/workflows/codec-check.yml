name: Validate format extensions
on:
  push:
    branches: [format-audit-sgi-sunras-raw-clarity]
permissions:
  contents: write
concurrency:
  group: validate-extra-formats
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install with frozen codec lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile
      - name: Regenerate in-app format help guide
        run: |
          bun run help:generate
          git add docs/USER_GUIDE.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync RAW and format help guide"
            git fetch origin format-audit-sgi-sunras-raw-clarity
            git rebase origin/format-audit-sgi-sunras-raw-clarity
            git push origin HEAD:format-audit-sgi-sunras-raw-clarity
          fi
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test format fixtures
        run: |
          bun scripts/validate-heritage-raster.ts
          bun scripts/validate-new-formats.ts
          bun run help:validate
      - name: Build app with WASM dependencies
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          bun run db:generate
          bun run icons
          bun run build
