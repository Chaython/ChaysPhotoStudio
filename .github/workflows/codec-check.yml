name: Validate format extensions
on:
  push:
    branches: [format-audit-sgi-sunras-raw-clarity]
permissions:
  contents: read
concurrency:
  group: validate-extra-formats
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install with frozen codec lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test format fixtures
        run: bun scripts/validate-heritage-raster.ts
      - name: Build app with WASM dependencies
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          bun run db:generate
          bun run icons
          bun run build
