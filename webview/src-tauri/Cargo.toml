[package]
name = "chays-photo-studio-webview"
version = "1.1.1"
description = "Chay's Photo Studio — lightweight system-webview shell"
authors = ["Chaython Meredith <chaython@live.ca>"]
license = "LicenseRef-LICENSE-in-repository"
edition = "2021"

[lib]
name = "chays_photo_studio_webview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
